name: ROOMFORGE CI
on:
  push:
    branches: [main]
    paths:
      - 'roomforge/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'vercel.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'roomforge/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'vercel.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roomforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: roomforge/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest Unit Tests
        run: npm run test
      - name: Run Legacy Math & Semantics Tests
        run: npm run test:legacy
      - name: TypeScript Strict Mode Check
        run: npm run typecheck
      - name: ESLint Check
        run: npm run lint
      - name: Next.js Production Build
        run: npm run build
      - name: Legacy JavaScript Syntax Check
        run: |
          for file in legacy/src/core/*.js legacy/src/pages/*.js legacy/src/ui/*.js; do node --check "$file"; done

name: RoomForge Quality Checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest Unit Tests
        run: npm run test
      - name: Run Legacy Tests
        run: npm run test:legacy
      - name: TypeScript Check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Next.js Build
        run: npm run build
      - name: Verify Legacy Syntax
        run: |
          for file in legacy/src/core/*.js legacy/src/pages/*.js legacy/src/ui/*.js; do node --check "$file"; done
